name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  shared-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - run: npm ci
        working-directory: shared
      - run: npm run build
        working-directory: shared

  backend-test:
    needs: shared-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: shared
      - run: npm run build
        working-directory: shared
      - run: npm ci
        working-directory: backend
      # shared's test script borrows backend's vitest via --prefix ../backend,
      # so it can only run after backend's install.
      - name: Test shared
        run: npm test
        working-directory: shared
      - run: npm test
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend-test:
    needs: shared-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: shared
      - run: npm run build
        working-directory: shared
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run check:theme-safety
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

  docker-build:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker images
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: docker compose build

  smoke-test:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: |
          docker compose up -d --wait
          sleep 5
      - name: Smoke test backend
        run: ./scripts/smoke-test.sh
        env:
          BASE_URL: http://localhost:3001
          SMOKE_ORIGIN: http://localhost:3000
