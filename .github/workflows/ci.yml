name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  NODE_VERSION: "22"
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

jobs:
  backend-test:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Respository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Build Shared Package
        run: |
          npm ci
          npm run build
        working-directory: shared

      - name: Test & Build Backend
        run: |
          npm ci
          npm test
          npm run build
        working-directory: backend

  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Respository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Shared Package
        run: |
          npm ci
          npm run build
        working-directory: shared

      - name: Test, Lint & Build Frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm test
          npm run check:theme-safety
          npm run lint
          npm run build
        working-directory: frontend

  docker-build:
    name: Build Docker Images
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Respository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Compose Stack
        run: docker compose build
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}

      - name: Build Cron Images
        run: |
          docker build -f Dockerfile.recon -t recon .
          docker build -f Dockerfile.signin -t signin .

  smoke-test:
    name: Run Smoke Tests
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Respository
        uses: actions/checkout@v4

      - name: Start Stack
        run: |
          docker compose up -d --wait
          sleep 5
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}

      - name: Execute Smoke Script
        run: ./scripts/smoke-test.sh
        env:
          BASE_URL: http://localhost:3001
          SMOKE_ORIGIN: http://localhost:3000