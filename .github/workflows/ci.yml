name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  HUSKY: 0
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

# Job ids and names are referenced by branch protection's required checks.
# Renaming one means updating the protection rules in the same change.
jobs:
  backend-test:
    name: Backend Guardrails, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build -w @css-atlas/shared

      - name: Guardrails, Test & Build Backend
        run: |
          npm run guardrails -w @css-atlas/backend
          npm test -w @css-atlas/backend
          npm run build -w @css-atlas/backend

  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build -w @css-atlas/shared

      - name: Test, Lint & Build Frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm test -w @css-atlas/frontend
          npm run check:theme-safety -w @css-atlas/frontend
          npm run guardrails -w @css-atlas/frontend
          npm run build -w @css-atlas/frontend

  repo-hygiene:
    name: Repo Hygiene (syncpack, knip)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Dependency Versions and Unused Code
        run: npm run hygiene

  docker-build:
    name: Build Docker Images
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Compose Stack
        run: docker compose build
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}


  smoke-test:
    name: Run Smoke Tests
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Stack
        run: |
          docker compose up -d --wait
          sleep 5
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}

      - name: Execute Smoke Script
        run: ./scripts/smoke-test.sh
        env:
          BASE_URL: http://localhost:3001
          SMOKE_ORIGIN: http://localhost:3000